name: 下载小说

# 手机浏览器操作：仓库 → Actions → “下载小说” → Run workflow → 填参数 → 跑完在 Artifacts 下载 txt
on:
  workflow_dispatch:
    inputs:
      url:
        description: '填写目录链接'
        required: true
        type: string
      start:
        description: '从第几章开始（默认 1）'
        required: false
        default: '1'
        type: string
      end:
        description: '到第几章为止（留空=最后一章）'
        required: false
        default: ''
        type: string
      min:
        description: '每章最小间隔毫秒（机房 IP 建议调大，默认 8000）'
        required: false
        default: '8000'
        type: string
      max:
        description: '每章最大间隔毫秒（默认 20000）'
        required: false
        default: '20000'
        type: string

# 同一本书的多次运行排队执行，避免并发同一 IP 段触发风控
concurrency:
  group: download-${{ github.event.inputs.url }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub 单任务上限 6h，留余量
    permissions:
      contents: write   # 发布 Release 资源需要写权限
    env:
      # 提前切到 Node 24 运行各 action，消除 “Node.js 20 actions are deprecated” 警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖与 Chromium
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      # 跨多次运行续传：把上次抓到的章节缓存下来，超时/重跑能接着抓
      - name: 恢复已下载进度（断点续传）
        uses: actions/cache@v4
        with:
          path: book_*
          key: book-${{ hashFiles('download.js') }}-${{ github.event.inputs.url }}-${{ github.run_id }}
          restore-keys: |
            book-${{ hashFiles('download.js') }}-${{ github.event.inputs.url }}-

      - name: 开始下载（headful + 虚拟显示器，提高过 CF 成功率）
        env:
          IN_URL: ${{ github.event.inputs.url }}
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_MIN: ${{ github.event.inputs.min }}
          IN_MAX: ${{ github.event.inputs.max }}
        run: |
          ARGS="$IN_URL --no-headless --start ${IN_START:-1} --min ${IN_MIN:-8000} --max ${IN_MAX:-20000}"
          if [ -n "$IN_END" ]; then ARGS="$ARGS --end $IN_END"; fi
          echo "运行参数: $ARGS"
          xvfb-run -a --server-args="-screen 0 1280x800x24" node download.js $ARGS

      - name: 整理产物
        if: always()
        run: |
          mkdir -p out
          # 合并后的整本 txt（这是你要的成品）
          cp book_*/book_*.txt out/ 2>/dev/null || true
          echo "==== 产物清单 ===="
          ls -lh out/ || true

      # 主下载方式：发布为 Release 资源 —— 手机点链接直接下载 .txt，不打包
      - name: 发布 txt 到 Release（手机点链接直接下载，无需解压）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有 txt 产物，跳过发布。"
            exit 0
          fi
          TAG="novel-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "小说下载 #${{ github.run_number }}" \
            --notes "目录: ${{ github.event.inputs.url }}  章节: ${{ github.event.inputs.start }} ~ ${{ github.event.inputs.end || '末章' }}" \
            "${files[@]}"
          echo "==================================================="
          echo "✅ 完成！在仓库 Releases 页面下载 txt（手机点文件名直接下载，无需解压）："
          echo "   https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "==================================================="

      # 备用方式：同时存为 Artifact（zip 包，作为兜底）
      - name: 备份到 Artifact（zip，兜底用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-txt
          path: out/
          retention-days: 7
          if-no-files-found: warn
